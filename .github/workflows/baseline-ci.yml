name: Baseline CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test policy tooling
        run: python3 -m unittest discover tools -p 'test_*.py'
      - name: Scan for forbidden secrets and active legacy code
        run: python3 tools/ci/check_forbidden_patterns.py
      - name: Require source-of-truth documents
        run: |
          test -s docs/architecture/requirements.md
          test -s docs/architecture/design.md
          test -s docs/architecture/task.md

  rust:
    name: Rust baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test workspace
        run: cargo test --workspace --all-targets --locked
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  android:
    name: Android baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - name: Verify dependency lock
        run: |
          ./gradlew --no-daemon --write-locks :apps:android:app:dependencies > dependency-report.txt
          git diff --exit-code -- apps/android/app/gradle.lockfile
      - name: Test, lint, and assemble test APK
        run: |
          ./gradlew --no-daemon \
            testDebugUnitTest \
            compileDebugAndroidTestKotlin \
            lintDebug \
            assembleDebug
      - name: Label test-only artifact and calculate SHA-256
        run: |
          mkdir -p artifacts
          cp apps/android/app/build/outputs/apk/debug/app-debug.apk \
            artifacts/TrustKin-phase0-debug-test-only.apk
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trustkin-phase0-test-only
          retention-days: 7
          if-no-files-found: error
          path: |
            artifacts/
            apps/android/app/build/reports/tests/
            apps/android/app/build/reports/lint-results-debug.html
            dependency-report.txt

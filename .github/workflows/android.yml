name: Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Test, lint and APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Dependency report
        run: ./gradlew --no-daemon app:dependencies > dependency-report.txt
      - name: SHA-256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: brotherhood-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            dependency-report.txt
          if-no-files-found: error

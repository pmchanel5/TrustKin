name: Android

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v4

      - name: Verify dependency lock and create report
        run: |
          ./gradlew --no-daemon :app:dependencies > dependency-report.txt
          git diff --exit-code -- app/gradle.lockfile

      - name: Test, compile device tests, lint and build APKs
        run: |
          ./gradlew --no-daemon \
            testDebugUnitTest \
            compileDebugAndroidTestKotlin \
            lintDebug \
            assembleDebug \
            assembleRelease

      - name: Label artifacts and calculate SHA-256
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/Brotherhood-0.2.0-alpha02-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/Brotherhood-0.2.0-alpha02-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: brotherhood-0.2.0-alpha02
          path: |
            dist/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            dependency-report.txt
            docs/RELEASE_NOTES_0.2.0-alpha02.md
          if-no-files-found: error

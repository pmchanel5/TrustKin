name: Issue traceability

on:
  issues:
    types: [opened, edited, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  traceability:
    name: Blocking issue traceability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate task references
        run: python3 tools/traceability/check_issue_traceability.py --event "$GITHUB_EVENT_PATH"

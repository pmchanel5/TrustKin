name: Publish tagged alpha artifacts

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3

      - name: Verify lock, test, lint and build
        run: |
          ./gradlew --no-daemon :app:dependencies > dependency-report.txt
          git diff --exit-code -- app/gradle.lockfile
          ./gradlew --no-daemon \
            testDebugUnitTest \
            compileDebugAndroidTestKotlin \
            lintDebug \
            assembleDebug \
            assembleRelease

      - name: Prepare clearly labelled artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/Brotherhood-0.2.0-alpha02-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
            dist/Brotherhood-0.2.0-alpha02-release-unsigned.apk
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/Brotherhood-0.2.0-alpha02-debug.apk \
            dist/Brotherhood-0.2.0-alpha02-release-unsigned.apk \
            dist/SHA256SUMS.txt \
            dependency-report.txt \
            --title "Brotherhood ${GITHUB_REF_NAME} (experimental)" \
            --notes-file docs/RELEASE_NOTES_0.2.0-alpha02.md
